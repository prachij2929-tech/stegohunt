<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StegnoHunt | Admin Panel</title>

<style>
:root{
    --cyan:#39E4E8;
    --purple:#5B3FD3;
    --bg:#0B0F1A;
    --card:#151A2E;
}
body{
    margin:0;
    font-family:Segoe UI, sans-serif;
    background:var(--bg);
    color:white;
}
header{
    padding:25px 60px;
    border-bottom:1px solid rgba(57,228,232,0.2);
    display:flex;
    justify-content:space-between;
    align-items:center;
}
header h2{ color:var(--cyan); }
.btn{
    padding:10px 25px;
    background:var(--purple);
    border:none;
    border-radius:25px;
    color:white;
    cursor:pointer;
}
.dashboard{
    padding:50px;
}
.card{
    background:var(--card);
    border:1px solid rgba(57,228,232,0.2);
    border-radius:18px;
    padding:25px;
    margin-bottom:25px;
}
.input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid rgba(57,228,232,0.3);
    background:#0B0F1A;
    color:white;
}
.employee{
    margin-top:15px;
    padding:15px;
    border:1px solid rgba(57,228,232,0.2);
    border-radius:12px;
}
</style>
</head>

<body>

<header>
    <h2>Admin Panel</h2>
    <button class="btn" onclick="logout()">Logout</button>
</header>

<div class="dashboard">

    <!-- ADD BUTTON -->
    <button class="btn" onclick="showForm()">Add Employee</button>

    <!-- FORM (HIDDEN) -->
    <div id="formBox" class="card" style="display:none;margin-top:20px;">
        <h3>Add Employee</h3>
        <input class="input" id="empName" placeholder="Name">
        <input class="input" id="empEmail" placeholder="Email">
        <input class="input" id="empPost" placeholder="Post">
        <button class="btn" style="margin-top:15px;" onclick="addEmployee()">Save</button>
    </div>

    <!-- EMPLOYEE LIST -->
    <div class="card">
        <h3 style="color:var(--cyan)">Employees</h3>
        <div id="employeeList"></div>
    </div>

</div>

<script>
function logout(){
    window.location.href = "/";
}

function showForm(){
    document.getElementById("formBox").style.display = "block";
}

function addEmployee(){
    const name = document.getElementById("empName").value;
    const email = document.getElementById("empEmail").value;
    const post = document.getElementById("empPost").value;

    if(!name || !email || !post){
        alert("All fields are required ❌");
        return;
    }

    fetch("/add-employee",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ name, email, post })
    })
    .then(r => r.json())
    .then(d => {
        if(d.status==="success"){
            alert(d.message || "Employee Added ✅");
            // Clear form
            document.getElementById("empName").value = "";
            document.getElementById("empEmail").value = "";
            document.getElementById("empPost").value = "";
            // Hide form if you want
            document.getElementById("formBox").style.display = "none";
            // Reload employee list
            loadEmployees();
        } else {
            alert(d.message || "Failed to add employee ❌");
        }
    })
    .catch(err => alert("Error saving employee ❌"));
}
function editEmployee(id, name, email, post){
    showForm();
    document.getElementById("empName").value = name;
    document.getElementById("empEmail").value = email;
    document.getElementById("empPost").value = post;

    const btn = document.querySelector("#formBox button");
    btn.innerText = "Update";
    btn.onclick = function(){ updateEmployee(id); };
}

function updateEmployee(id){
    fetch("/update-employee", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            id: id,
            name: document.getElementById("empName").value,
            email: document.getElementById("empEmail").value,
            post: document.getElementById("empPost").value
        })
    })
    .then(r=>r.json())
    .then(d=>{
        if(d.status==="success"){
            alert("Employee Updated ✅");
            loadEmployees();
            document.getElementById("formBox").style.display="none";

            // Reset Save button for new entries
            const btn = document.querySelector("#formBox button");
            btn.innerText = "Save";
            btn.onclick = addEmployee;
        }
    });
}

function deleteEmployee(id){
    if(!confirm("Are you sure you want to delete this employee?")) return;

    fetch("/delete-employee", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({id:id})
    })
    .then(r=>r.json())
    .then(d=>{
        if(d.status==="success"){
            alert("Employee Deleted ✅");
            loadEmployees();
        }
    });
}

function loadEmployees(){
    fetch("/get-employees")
    .then(r=>r.json())
    .then(data=>{
        let html="";
        data.forEach(e=>{
            html+=`
            <div class="employee" id="emp-${e.id}">
                <b>${e.name}</b><br>
                ${e.post}<br>
                <small>${e.email}</small><br>
                <button class="btn" onclick="editEmployee(${e.id}, '${e.name}', '${e.email}', '${e.post}')">Edit</button>
                <button class="btn" style="background:red;" onclick="deleteEmployee(${e.id})">Delete</button>
            </div>`;
        });
        document.getElementById("employeeList").innerHTML = html;
    });
}
window.onload = loadEmployees;
</script>

</body>
</html>
